server {
    listen 80;
    server_name qdesafio.com www.qdesafio.com;

    # Servir el cliente Angular como estático
    root /home/ubuntu/qdesafio/client/dist/qdesafio-client/browser;
    index index.html;

    # Compresión gzip para mejor performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Proxy de Socket.IO al servidor Node
    # Ajustes específicos para WebSocket: Upgrade + Connection upgrade
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tiempo de espera largo para conexiones websocket persistentes
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check del servidor (opcional, útil para debugging)
    location /health {
        proxy_pass http://localhost:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache agresivo para assets con hash en el nombre
    location ~* \.(js|css|webp|png|jpg|jpeg|gif|svg|woff|woff2|ttf|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # robots.txt y sitemap.xml — no cachear largo
    location = /robots.txt {
        expires 1d;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        expires 1d;
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta no encontrada va a index.html
    # Imprescindible para Angular Router (rutas como /levels, /solo/3...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
